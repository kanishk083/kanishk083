<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 235" role="img" aria-labelledby="title desc">
  <title id="title">Kanishk Wagh — AI Systems Engineer</title>
  <desc id="desc">A monochrome identity card describing Kanishk's role and engineering focus.</desc>
  <defs>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .bold { font-family: Inter, "Arial Black", Arial, sans-serif; font-size: 58px; font-weight: 800; letter-spacing: 2px; fill: #fff; }
    .script { font-family: "Segoe Script", "Brush Script MT", "Snell Roundhand", cursive; font-size: 66px; font-style: italic; font-weight: 600; fill: #fff; }
    .role { font-family: Inter, Arial, sans-serif; font-size: 20px; font-weight: 650; letter-spacing: 1px; fill: #e6edf3; }
    .copy { font-family: Inter, Arial, sans-serif; font-size: 17px; fill: #9da7b3; }
    .eyebrow { font-family: Inter, Arial, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 2.6px; fill: #8b949e; }
    .signature { animation: settle 8s cubic-bezier(.45,0,.55,1) infinite; transform-origin: 445px 82px; }
    .line { animation: draw 7s ease-in-out infinite; transform-origin: left; }
    .pulse { animation: pulse 4.5s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes settle { 0%,100% { opacity: .92; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-1px); } }
    @keyframes draw { 0%,100% { transform: scaleX(.35); opacity: .35; } 50% { transform: scaleX(1); opacity: .9; } }
    @keyframes pulse { 0%,100% { opacity: .3; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="1" y="1" width="1198" height="233" rx="20" fill="#0d1117" stroke="#30363d"/>
  <text x="58" y="40" class="eyebrow">PRODUCTION AI · BACKEND SYSTEMS · AUTOMATION</text>
  <g class="signature">
    <text x="56" y="106" class="bold">KANISHK</text>
    <text x="400" y="106" class="script">Wagh</text>
  </g>
  <rect x="58" y="121" width="535" height="1" fill="url(#rule)" class="line"/>
  <text x="58" y="151" class="role">AI Systems Engineer</text>
  <text x="58" y="184" class="copy">I build production AI products across LLMs, computer vision, retrieval, and backend infrastructure—</text>
  <text x="58" y="207" class="copy">turning ambitious prototypes into reliable systems with measurable performance and business value.</text>
  <g transform="translate(1060 117)">
    <circle r="55" fill="none" stroke="#fff" stroke-opacity=".12"/>
    <circle r="34" fill="none" stroke="#fff" stroke-opacity=".22" stroke-dasharray="3 8"/>
    <circle r="7" fill="#fff" class="pulse" filter="url(#glow)"/>
    <path d="M-74 0H-18M18 0H74M0-74V-18M0 18V74" stroke="#fff" stroke-opacity=".28"/>
  </g>
</svg>
