<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Kanishk Wagh — building intelligent systems</title>
  <desc id="desc">An animated monochrome illustration of a developer and human robotic hands connected by a living technical interface.</desc>
  <defs>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="458" rx="24"/></clipPath>
    <clipPath id="left"><rect x="0" y="0" width="445" height="460"/></clipPath>
    <clipPath id="middle"><rect x="370" y="0" width="500" height="460"/></clipPath>
    <clipPath id="right"><rect x="790" y="0" width="410" height="460"/></clipPath>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".06"/>
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".32"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="contact" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".28" stop-color="#fff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .base { animation: breathe 18s ease-in-out infinite; transform-origin: 600px 230px; }
    .left-layer { opacity: .24; animation: leftFloat 7s ease-in-out infinite; transform-origin: 250px 260px; }
    .middle-layer { opacity: .24; animation: middleFloat 9s ease-in-out infinite; transform-origin: 620px 230px; }
    .right-layer { opacity: .28; animation: handsMeet 6.5s ease-in-out infinite; transform-origin: 1015px 215px; }
    .vertical-sweep { animation: sweepAcross 6.8s ease-in-out infinite; }
    .horizontal-sweep { animation: sweepDown 7.5s ease-in-out infinite; }
    .circuit { fill: none; stroke: #fff; stroke-width: 1; opacity: .42; stroke-dasharray: 3 13; animation: circuitFlow 3.6s linear infinite; }
    .circuit.two { animation-delay: -1.3s; opacity: .28; }
    .spark { fill: #fff; animation: spark 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .spark.two { animation-delay: -.8s; }
    .spark.three { animation-delay: -1.6s; }
    .contact-core { animation: contactPulse 2.2s ease-in-out infinite; transform-origin: 1018px 214px; }
    .contact-ring { fill: none; stroke: #fff; animation: ring 2.2s ease-out infinite; transform-origin: 1018px 214px; }
    .contact-ring.two { animation-delay: -1.1s; }
    .code { fill: #fff; opacity: .22; animation: codeBlink 3.5s ease-in-out infinite; }
    .code.two { animation-delay: -1.2s; }
    .code.three { animation-delay: -2.4s; }
    .frame { fill: none; stroke: #fff; stroke-width: 1; opacity: .36; stroke-dasharray: 18 9; animation: frameFlow 10s linear infinite; }
    @keyframes breathe { 0%,100% { transform: scale(1); opacity: .94; } 50% { transform: scale(1.006); opacity: 1; } }
    @keyframes leftFloat { 0%,100% { transform: translate(0,0); } 50% { transform: translate(2px,-3px) scale(1.003); } }
    @keyframes middleFloat { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(2px) scale(1.004); } }
    @keyframes handsMeet { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-3px,2px) scale(1.004); } }
    @keyframes sweepAcross { 0%,100% { transform: translateX(-210px); opacity: 0; } 18%,82% { opacity: .8; } 50% { transform: translateX(1410px); } }
    @keyframes sweepDown { 0%,100% { transform: translateY(-12px); opacity: 0; } 16%,84% { opacity: .45; } 50% { transform: translateY(472px); } }
    @keyframes circuitFlow { to { stroke-dashoffset: -64; } }
    @keyframes spark { 0%,100% { opacity: .16; transform: scale(.65); } 50% { opacity: 1; transform: scale(1.45); } }
    @keyframes contactPulse { 0%,100% { opacity: .25; transform: scale(.72); } 50% { opacity: .9; transform: scale(1.18); } }
    @keyframes ring { 0% { opacity: .8; transform: scale(.5); } 80%,100% { opacity: 0; transform: scale(2.2); } }
    @keyframes codeBlink { 0%,100% { opacity: .12; } 45% { opacity: .28; } 50% { opacity: .72; } 55% { opacity: .24; } }
    @keyframes frameFlow { to { stroke-dashoffset: -72; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="460" fill="#000"/>

    <!-- The original hero remains the source; clipped duplicates create restrained parallax. -->
    <image class="base" href="./profile-hero-mono.png" xlink:href="./profile-hero-mono.png" x="0" y="0" width="1200" height="460" preserveAspectRatio="xMidYMid slice"/>
    <g clip-path="url(#left)">
      <image class="left-layer" href="./profile-hero-mono.png" xlink:href="./profile-hero-mono.png" x="0" y="0" width="1200" height="460" preserveAspectRatio="xMidYMid slice" filter="url(#softGlow)"/>
    </g>
    <g clip-path="url(#middle)">
      <image class="middle-layer" href="./profile-hero-mono.png" xlink:href="./profile-hero-mono.png" x="0" y="0" width="1200" height="460" preserveAspectRatio="xMidYMid slice" filter="url(#softGlow)"/>
    </g>
    <g clip-path="url(#right)">
      <image class="right-layer" href="./profile-hero-mono.png" xlink:href="./profile-hero-mono.png" x="0" y="0" width="1200" height="460" preserveAspectRatio="xMidYMid slice" filter="url(#softGlow)"/>
    </g>
    <rect width="1200" height="460" fill="url(#shade)"/>

    <!-- Motion accents follow the existing interface and circuit artwork. -->
    <rect class="vertical-sweep" x="-210" y="0" width="210" height="460" fill="url(#sweep)" opacity=".38"/>
    <rect class="horizontal-sweep" x="0" y="-4" width="1200" height="2" fill="#fff" opacity=".3" filter="url(#softGlow)"/>
    <path class="circuit" d="M830 330 H886 L912 304 H948 L972 280 H1018"/>
    <path class="circuit two" d="M882 372 H930 L958 344 H1002 L1040 306 H1128"/>
    <path class="circuit" d="M78 335 H132 L158 310 H212 L240 282 H328"/>
    <circle class="spark" cx="886" cy="330" r="2" filter="url(#softGlow)"/>
    <circle class="spark two" cx="972" cy="280" r="2" filter="url(#softGlow)"/>
    <circle class="spark three" cx="158" cy="310" r="2" filter="url(#softGlow)"/>

    <!-- The human/robot contact point carries the primary motion cue. -->
    <circle class="contact-core" cx="1018" cy="214" r="28" fill="url(#contact)"/>
    <circle class="contact-ring" cx="1018" cy="214" r="12"/>
    <circle class="contact-ring two" cx="1018" cy="214" r="12"/>
    <circle cx="1018" cy="214" r="2.5" fill="#fff" filter="url(#softGlow)"/>

    <!-- Small code pulses animate the developer side without replacing the artwork. -->
    <g class="code"><rect x="72" y="91" width="48" height="1"/><rect x="72" y="98" width="31" height="1"/><rect x="72" y="105" width="57" height="1"/></g>
    <g class="code two"><rect x="285" y="122" width="52" height="1"/><rect x="285" y="129" width="37" height="1"/><rect x="285" y="136" width="61" height="1"/></g>
    <g class="code three"><rect x="428" y="337" width="44" height="1"/><rect x="428" y="344" width="29" height="1"/><rect x="428" y="351" width="54" height="1"/></g>

    <rect class="frame" x="18" y="18" width="1164" height="424" rx="18"/>
  </g>
  <rect x="1" y="1" width="1198" height="458" rx="24" fill="none" stroke="#fff" stroke-opacity=".42"/>
</svg>
